pose_type: 3d
mode: fused
use_dataset_initialization: true
quaternion_manifold_pf_15d:
  pose_type: 3d
  mode: fused
  num_particles: 5000
  resample_threshold_ratio: 0.5
  seed: 7
  resampling_method: systematic
  motion_model:
    translation_input_frame: body
    translation_input_type: acceleration
    rotation_input_type: rate
    gravity: [0.0, 0.0, -9.81]
    process_noise_diag: [1.0e-6, 1.0e-6, 1.0e-6, 2.0e-3, 2.0e-3, 2.0e-3, 2.0e-3, 2.0e-3, 2.0e-3, 1.0e-8, 1.0e-8, 1.0e-8, 1.0e-5, 1.0e-5, 1.0e-5]
  measurement_model:
    measurement_noise_diag: [2.5e-3, 2.5e-3, 2.5e-3]
    measurement_rejuvenation: true
    measurement_rejuvenation_std: [0.05, 0.05, 0.05]
    estimate_method: weighted_mean
  initialization:
    mean: [0, 0, 0, 0, 0, 0]
    velocity_mean: [0, 0, 0]
    cov_diag: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-5, 1.0e-5, 1.0e-5, 1.0e-4, 1.0e-4, 1.0e-4]
