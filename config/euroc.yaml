dataset:
  type: euroc
  name: euroc
  sequence: V1_01_easy
  root: data/euroc/V1_01_easy/mav0
  imu_stride: 5
  measurement_stride: 20
  position_noise_std: 0.05
  seed: 0
  gravity: [0.0, 0.0, -9.81]
pose_type: 3d
mode: fused
use_dataset_initialization: true
output_root: outputs

measurements:
  use_position: true
  use_velocity: false
  use_attitude: false
  velocity_measurement_noise_diag: [1.0e-2, 1.0e-2, 1.0e-2]
  attitude_measurement_noise_diag: [7.6e-5, 7.6e-5, 7.6e-5]
