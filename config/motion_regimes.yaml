defaults:
  seed: 71
  trajectory:
    duration_sec: 45.0
    dt: 0.02
    amplitude_x: 8.0
    amplitude_y: 5.0
    amplitude_z: 0.15
    z0: 1.0
    omega_rad_s: 0.22
  attitude:
    yaw_offset_deg: 0.0
    roll_freq_rad_s: 0.55
    pitch_freq_rad_s: 0.45
  imu:
    gravity: [0.0, 0.0, -9.81]
    accel_noise_std: [0.04, 0.04, 0.05]
    gyro_noise_std: [0.002, 0.002, 0.0025]
    accel_bias_initial: [0.06, -0.04, 0.05]
    gyro_bias_initial: [0.002, -0.0015, 0.001]
    accel_bias_rw_std: [0.001, 0.001, 0.001]
    gyro_bias_rw_std: [3.0e-5, 3.0e-5, 3.0e-5]
  gnss:
    stride: 50
    noise_std: [0.12, 0.12, 0.18]
